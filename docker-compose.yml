# All values come from .env (see .env.example)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-dumps:/tmp/dumps
    labels:
      # offen runs this inside the db container before each backup
      - docker-volume-backup.archive-pre=/bin/sh -c 'pg_dump --clean --if-exists -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" > /tmp/dumps/dump.sql'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging: *default-logging

  app:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *default-logging

  backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    depends_on:
      - db
    environment:
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON_EXPRESSION}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_FILENAME: backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: backup-
    volumes:
      - db-dumps:/backup/db-dumps:ro
      - ./backups:/archive
      # needed to run the pg_dump label in the db container
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

volumes:
  db-data:
  db-dumps:

networks:
  backend-net:
  frontend-net:
