name: frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/docker-ci.yml"
      - ".github/workflows/frontend.yml"
      # documentation changes do not run the pipeline
      - "!**/*.md"
  pull_request:
    paths: *paths

jobs:
  ci:
    uses: ./.github/workflows/docker-ci.yml
    with:
      app: frontend
      image: olympic-games-starter
      # pull requests only run the tests
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
      checks: write
