# Reusable pipeline: test an app in its Docker image, then push the image to GHCR.
# Called by backend.yml and frontend.yml.
name: docker-ci

on:
  workflow_call:
    inputs:
      app:
        description: App folder (also the Docker build context)
        required: true
        type: string
      image:
        description: Image name, pushed as ghcr.io/<owner>/<image>
        required: true
        type: string
      push:
        description: Push the image to GHCR after the tests pass
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # exposes the GitHub Actions cache to the docker build in run-tests.sh
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Run tests in Docker
        run: scripts/run-tests.sh ${{ inputs.app }}
        env:
          DOCKER_BUILD_ARGS: >-
            --cache-from type=gha,scope=${{ inputs.app }}
            --cache-to type=gha,mode=max,scope=${{ inputs.app }}

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/${{ inputs.app }}/*.xml
          check_name: ${{ inputs.app }} tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-test-reports
          path: reports/${{ inputs.app }}

  publish:
    needs: test
    if: inputs.push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags: sha-<short>, 1.2.3 / 1.2 from v1.2.3 git tags, latest on main
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # reuses the cached test layers: the tests are not run again
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
